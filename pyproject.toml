[project]
name = "django-mvp-charts"
version = "0.2.0"
description = "Charts for django-mvp projects: build them in Python with pyecharts, place them with one Cotton component"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# django-mvp supplies the classes the component's markup uses. pyecharts is the
# API: the component takes nothing else. 2.1 is its first release targeting
# ECharts 6.
dependencies = ["django>=5.2", "django-mvp>=0.24.0", "pyecharts>=2.1,<3.0"]
keywords = ["django", "charts", "echarts", "pyecharts", "dataviz", "cotton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/django-mvp/django-mvp-charts"
Repository = "https://github.com/django-mvp/django-mvp-charts"
Issues = "https://github.com/django-mvp/django-mvp-charts/issues"

[tool.hatch.build.targets.wheel]
packages = ["mvp_charts"]

# Hatchling's default sdist is the whole working tree; this keeps it to the
# package, the readme and the licence.
[tool.hatch.build.targets.sdist]
include = ["mvp_charts", "README.md", "LICENSE"]

# django-cotton is deliberately absent from the dependency list. django-mvp pins
# it exactly; a second constraint here could only ever fight that one, and this
# package has no say in which version a project runs.

[dependency-groups]
# Shared toolchain bundle from django-mvp/shared, pinned to a release tag so
# every package in this organisation runs one version of each tool. Ships ruff,
# mypy, deptry, pre-commit, pytest, pytest-django, coverage and django-stubs.
dev = ["mvp-shared[dev,test]"]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]
# The browser tests' event loop makes Django refuse the harness's own test
# database setup. This package makes no ORM calls, and pytest-django's autouse
# database fixture rules out scoping the setting to the browser tests.
env = ["DJANGO_ALLOW_ASYNC_UNSAFE=1"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["mvp_charts"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# The shared rule set lives in ruff-base.toml, copied in from django-mvp/shared
# rather than referenced remotely, because `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# The demo project is a demonstration target, never deployed: its settings carry
# a literal SECRET_KEY on purpose.
"demo/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["mvp_charts"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "mvp_charts/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.forge.conformance]
# None of these has a module under mvp_charts/ to mirror: the app registry and
# installed layout, the undistributed demo, Cotton templates, and the suite's
# own browser fixture.
non-mirror-paths = [
  "tests/test_app.py",
  "tests/test_demo.py",
  "tests/test_components/",
  "tests/test_browser_guard.py",
]

[tool.deptry]
extend_exclude = ["tests/", "demo/", "docs/"]

[tool.deptry.per_rule_ignores]
# django-mvp is a runtime dependency no module imports: the component renders
# inside its layout and theme.
DEP002 = ["django-mvp"]
